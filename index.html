<style>/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f1f0eb; --surface-3: #e9e7e0;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #77756f;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.12);
  --brand: #1f4e79; --brand-ink: #ffffff; --link: #1c5cab;
  --up: #006300; --down: #c02f2f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --other: #a8a69f;
  --st-good: #0ca30c; --st-warning: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --flag-high-bg: #fde9e7; --flag-warn-bg: #fff4d6; --flag-info-bg: #e8f0fb;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.12);
    --brand: #9cc3ef; --brand-ink: #0d0d0d; --link: #86b6ef;
    --up: #0ca30c; --down: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #6b6a65;
    --flag-high-bg: #3a1716; --flag-warn-bg: #352a0c; --flag-info-bg: #15263c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.12);
  --brand: #9cc3ef; --brand-ink: #0d0d0d; --link: #86b6ef;
  --up: #0ca30c; --down: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #6b6a65;
  --flag-high-bg: #3a1716; --flag-warn-bg: #352a0c; --flag-info-bg: #15263c;
  --shadow: none;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.num, td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar-inner { max-width: 1400px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; color: var(--brand); white-space: nowrap; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.crumbs { flex: 1 1 auto; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs a { color: var(--link); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--border);
  background: var(--surface-2); border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:focus-visible, summary:focus-visible, a:focus-visible, .rowbtn:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn .ico { width: 16px; height: 16px; }
.badge { display: inline-block; min-width: 20px; padding: 1px 7px; border-radius: 999px; background: var(--st-warning); color: #1a1a19; font-size: 12px; font-weight: 600; text-align: center; }

main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
.page-head h1 { margin: 0; font-size: 22px; line-height: 1.2; }
.page-head .sub { color: var(--ink-2); margin-top: 4px; }
.pager { display: flex; gap: 6px; }

/* ---------- collapsible cards ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; }
@media (max-width: 1000px) { .span-8, .span-6, .span-4 { grid-column: span 12; } }
details.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
details.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 44px;
  padding: 10px 14px; border-radius: var(--radius); user-select: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary:hover { background: var(--surface-2); }
details.card > summary h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1 1 auto; }
details.card > summary .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.chev { width: 24px; height: 24px; flex: 0 0 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); transition: transform .15s ease; }
details.card[open] > summary .chev { transform: rotate(90deg); }
details.card[open] > summary { border-bottom: 1px solid var(--border); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.card-body { padding: 14px; min-width: 0; }
.card-body > *:first-child { margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

/* ---------- KPI tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .lbl { color: var(--ink-2); font-size: 12px; }
.tile .val { font-size: 22px; font-weight: 650; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
.tile .note { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.tile.hero .val { font-size: 26px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; text-align: left; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.t thead th.sortable { cursor: pointer; }
table.t thead th.sortable:hover { color: var(--ink); }
table.t thead th[aria-sort="ascending"]::after { content: " \25B2"; font-size: 9px; }
table.t thead th[aria-sort="descending"]::after { content: " \25BC"; font-size: 9px; }
table.t tbody tr:hover { background: var(--surface-2); }
table.t tfoot td { font-weight: 650; border-top: 1px solid var(--axis); border-bottom: none; }
table.t tr.group td { background: var(--surface-2); font-weight: 650; color: var(--ink-2); }
table.t td.fund a { font-weight: 600; }
table.t tr.detail td { background: var(--surface-2); }
.rowbtn { border: none; background: none; cursor: pointer; padding: 2px 4px; min-width: 28px; min-height: 28px; border-radius: 6px; color: var(--ink-2); }
.rowbtn[aria-expanded="true"] svg { transform: rotate(90deg); }
.rowbtn svg { transition: transform .15s; }

/* key-value tearsheet (mirrors the GP "Fund Overview") */
table.kv { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.kv td { padding: 7px 10px; border-bottom: 1px solid var(--grid); }
table.kv td:first-child { color: var(--ink-2); width: 48%; }
table.kv tr.band td { border-top: 2px solid var(--axis); }
table.kv tr.em td { font-weight: 700; color: var(--ink); }
.chk { font-size: 12px; margin-left: 6px; }

/* ---------- flags ---------- */
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.flag { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; }
.flag.high { background: var(--flag-high-bg); } .flag.warn { background: var(--flag-warn-bg); } .flag.info { background: var(--flag-info-bg); }
.flag .fi { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; }
.flag.high .fi { color: var(--st-critical); } .flag.warn .fi { color: #b07800; } .flag.info .fi { color: var(--s1); }
.flag .lvl { font-weight: 650; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; margin-right: 4px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.est { background: var(--flag-warn-bg); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- charts ---------- */
.chart-box { position: relative; width: 100%; height: 300px; }
.chart-box.tall { height: 360px; } .chart-box.short { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 800px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.prose p { margin: 0 0 8px; } .prose ul { margin: 4px 0 10px; padding-left: 20px; } .prose h3 { font-size: 13.5px; margin: 12px 0 4px; }
.hint { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); }
code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.lock { max-width: 380px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
.lock input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font: inherit; }
.empty { color: var(--muted); padding: 6px 0; }
footer { max-width: 1400px; margin: 0 auto; padding: 8px 16px 28px; color: var(--muted); font-size: 12px; }

@media (max-width: 600px) {
  .topbar-inner { gap: 8px; }
  .btn .lbl-txt { display: none; }
  .page-head h1 { font-size: 19px; }
  .tile .val { font-size: 19px; }
  .crumbs { order: 3; flex-basis: 100%; }
}

/* ---------- print ---------- */
@media print {
  @page { margin: 12mm; }
  body { background: #fff; color: #000; font-size: 11px; }
  .topbar, .tools, .pager, .no-print, .rowbtn { display: none !important; }
  main { max-width: none; padding: 0; }
  details.card { box-shadow: none; border-color: #ccc; }
  details.card > summary { break-after: avoid; }
  .tile, tr, .chart-box, .flag, table.kv tr { break-inside: avoid; }
  details.card > summary .chev { display: none; }
  .table-wrap { overflow: visible; }
  table.t thead th { position: static; }
  .grid { display: block; } .grid > * { margin-bottom: 10px; }
  .chart-box { height: 240px; }
}

<script>/* Alternative Investments dashboard - vanilla JS, Chart.js, SheetJS.
   Modes: "full" (desktop, rescan enabled), "readonly" (Tailscale), "static" (encrypted GitHub page). */
(() => {
"use strict";

const MODE = window.APP_MODE || "full";
const S = { data: null, charts: [], queue: [], tables: {}, route: [] };
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

/* ------------------------------------------------------------------ icons */
const svg = (p, vb = "0 0 24 24") => `<svg class="ico" viewBox="${vb}" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  chev: svg('<path d="M9 6l6 6-6 6"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  expand: svg('<path d="M7 9l5 5 5-5"/><path d="M7 4l5 5 5-5" opacity=".5"/>'),
  collapse: svg('<path d="M7 15l5-5 5 5"/><path d="M7 20l5-5 5 5" opacity=".5"/>'),
  excel: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/>'),
  print: svg('<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'),
  refresh: svg('<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'),
  high: svg('<circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/>'),
  warn: svg('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17v.5"/>'),
  info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5V8"/>'),
  back: svg('<path d="M15 18l-6-6 6-6"/>'),
  next: svg('<path d="M9 6l6 6-6 6"/>'),
};

/* ------------------------------------------------------------------ formatting */
const SYM = { USD: "$", EUR: "€", GBP: "£" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (v) => typeof v === "number" && isFinite(v);
function money(v, ccy = "USD", compact = false) {
  if (!isNum(v)) return "–";
  const a = Math.abs(v);
  let s;
  if (compact) {
    if (a >= 1e9) s = (a / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "bn";
    else if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + "m";
    else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "k";
    else s = a.toFixed(0);
  } else s = a.toLocaleString("en-US", { maximumFractionDigits: 0 });
  const sym = SYM[ccy];
  s = sym ? sym + s : s + " " + (ccy || "");
  return (v < 0 ? "−" : "") + s;
}
const moneyC = (v, c) => money(v, c, true);
const num = (v) => (isNum(v) ? v.toLocaleString("en-US", { maximumFractionDigits: 0 }) : "–");
const pct = (v, dp = 1) => (isNum(v) ? (v * 100).toFixed(dp) + "%" : "–");
const mult = (v) => (isNum(v) ? v.toFixed(2) + "x" : "–");
const signed = (v, f) => (isNum(v) ? (v > 0 ? "+" : "") + f(v) : "–");
const cls = (v) => (isNum(v) ? (v > 0 ? "up" : v < 0 ? "down" : "") : "");
function fdate(d) {
  if (!d) return "–";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? esc(d) : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function daysOld(d) { return d ? Math.round((new Date(S.data.today) - new Date(d)) / 864e5) : null; }
function fileLabel(f) {
  let n = f.split(/[\\/]/).pop();
  try { n = decodeURIComponent(n).replace(/\+/g, " "); } catch (e) { /* keep raw */ }
  return n.replace(/^\d{10}_/, "");
}
const DOC_TYPE = { quarterly_report: "Quarterly report", financial_statements: "Financial statements", capital_account_statement: "Capital account statement",
  capital_call: "Capital call notice", distribution_notice: "Distribution notice", fact_sheet: "Fact sheet", letter: "Investor letter", other: "Other" };

/* ------------------------------------------------------------------ storage (per-viewer conveniences) */
const store = {
  get(k) { try { return localStorage.getItem("altinv:" + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("altinv:" + k, v); } catch (e) { /* private mode */ } },
};

/* ------------------------------------------------------------------ theme */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const dark = currentDark();
  const b = $("#btn-theme");
  if (b) { b.innerHTML = (dark ? ICON.sun : ICON.moon) + `<span class="lbl-txt">${dark ? "Day" : "Night"}</span>`; b.setAttribute("aria-label", dark ? "Switch to day view" : "Switch to night view"); }
}
const currentDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
applyTheme(store.get("theme"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!store.get("theme")) { applyTheme(null); render(); } });

/* ------------------------------------------------------------------ colours */
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = () => [1, 2, 3, 4, 5, 6, 7, 8].map((i) => css("--s" + i));
const STRAT_SLOT = { Buyout: 0, Growth: 1, Secondaries: 2, Credit: 3, Infrastructure: 4, "Hedge Fund": 5, Venture: 6, "Real Estate": 7 };
function fundColors() {
  // colour follows the fund: top 7 by commitment keep fixed slots, the rest fold into "Other"
  const withLp = S.data.funds.filter((f) => f.lp && isNum(f.lp.commitment_usd)).sort((a, b) => b.lp.commitment_usd - a.lp.commitment_usd);
  const map = {}, ser = SERIES();
  withLp.forEach((f, i) => { map[f.key] = i < 7 ? ser[i] : css("--other"); });
  return map;
}

/* ------------------------------------------------------------------ cards (collapsible) */
const pageKey = () => (S.route[0] || "home") + (S.route[1] ? ":" + S.route[1] : "");
function card(id, title, body, opt = {}) {
  const span = opt.span || 12;
  const k = (opt.global ? "g" : pageKey()) + ":" + id;
  const saved = store.get("open:" + k);
  const open = saved === null ? opt.open !== false : saved === "1";
  return `<details class="card span-${span}" data-key="${esc(k)}" ${open ? "open" : ""}>
    <summary><span class="chev">${ICON.chev}</span><h2>${title}</h2>${opt.meta ? `<span class="meta">${opt.meta}</span>` : ""}</summary>
    <div class="card-body">${body}</div></details>`;
}
function wireCards(root) {
  $$("details.card", root).forEach((d) => d.addEventListener("toggle", () => {
    store.set("open:" + d.dataset.key, d.open ? "1" : "0");
    if (d.open) resizeCharts(d);
  }));
}
function resizeCharts(scope) {
  S.charts.forEach((c) => { if (!scope || scope.contains(c.canvas)) { c.resize(); } });
}
function setAll(open) {
  $$("details.card").forEach((d) => { d.open = open; store.set("open:" + d.dataset.key, open ? "1" : "0"); });
  if (open) resizeCharts();
}

/* ------------------------------------------------------------------ charts */
function chart(id, cfgFn) { S.queue.push([id, cfgFn]); return `<div class="chart-box ${cfgFn.size || ""}"><canvas id="${id}" role="img" aria-label="${esc(cfgFn.label || "chart")}"></canvas></div>`; }
function drawCharts() {
  if (!window.Chart) { S.queue = []; return; }
  const ink2 = css("--ink-2"), grid = css("--grid"), axis = css("--axis"), surface = css("--surface");
  Chart.defaults.font.family = css("--font") || "system-ui";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = ink2;
  Chart.defaults.borderColor = grid;
  Chart.defaults.animation.duration = 250;
  Chart.defaults.plugins.legend.display = false;
  Chart.defaults.plugins.tooltip.backgroundColor = currentDark() ? "#2c2c2a" : "#0b0b0b";
  Chart.defaults.plugins.tooltip.padding = 8;
  Chart.defaults.maintainAspectRatio = false;
  S.queue.forEach(([id, fn]) => {
    const el = document.getElementById(id);
    if (!el) return;
    const cfg = fn({ ink2, grid, axis, surface, series: SERIES() });
    S.charts.push(new Chart(el, cfg));
  });
  S.queue = [];
}
function destroyCharts() { S.charts.forEach((c) => c.destroy()); S.charts = []; S.queue = []; }
function scales(o = {}) {
  const g = css("--grid"), a = css("--axis");
  return {
    x: { grid: { display: !!o.xgrid, color: g }, border: { color: a }, ticks: { maxRotation: 0, autoSkip: true, ...(o.xtick ? { callback: o.xtick } : {}) }, stacked: !!o.stacked },
    y: { grid: { color: g }, border: { display: false }, ticks: { callback: o.ytick || ((v) => moneyC(v, o.ccy || "USD")) }, stacked: !!o.stacked, beginAtZero: true },
  };
}
function shortLabel(v) { const l = String(this.getLabelForValue(v)); return l.length > 24 ? l.slice(0, 23) + "…" : l; }
const legend = (items) => `<div class="legend">${items.map(([c, l]) => `<span><span class="dot" style="background:${c}"></span>${esc(l)}</span>`).join("")}</div>`;

/* ------------------------------------------------------------------ sortable tables */
function table(id, cols, rows, opt = {}) {
  S.tables[id] = { cols, rows, opt, sort: S.tables[id]?.sort || opt.sort || null };
  return `<div class="table-wrap"><table class="t" id="${id}"><thead><tr>${cols.map((c, i) =>
    `<th class="${c.n ? "n" : ""} ${c.sortable === false ? "" : "sortable"}" data-i="${i}" scope="col" ${c.title ? `title="${esc(c.title)}"` : ""}>${c.h}</th>`).join("")}</tr></thead>
    <tbody>${tbody(id)}</tbody>${opt.foot ? `<tfoot>${opt.foot}</tfoot>` : ""}</table></div>`;
}
function tbody(id) {
  const t = S.tables[id];
  let rows = t.rows.slice();
  if (t.sort) {
    const c = t.cols[t.sort.i], dir = t.sort.dir;
    const val = c.v || (() => 0);
    rows.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  }
  return rows.map((r, ri) => (t.opt.rowHtml ? t.opt.rowHtml(r, ri) : `<tr>${t.cols.map((c) => `<td class="${c.n ? "n" : ""} ${c.cls || ""}">${c.r(r)}</td>`).join("")}</tr>`)).join("")
    || `<tr><td colspan="${t.cols.length}" class="empty">No rows</td></tr>`;
}
function wireTables(root) {
  $$("table.t thead th.sortable", root).forEach((th) => th.addEventListener("click", () => {
    const tb = th.closest("table"), t = S.tables[tb.id], i = +th.dataset.i;
    t.sort = t.sort && t.sort.i === i ? { i, dir: -t.sort.dir } : { i, dir: t.cols[i].n ? -1 : 1 };
    $$("th", tb).forEach((h) => h.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", t.sort.dir > 0 ? "ascending" : "descending");
    $("tbody", tb).innerHTML = tbody(tb.id);
  }));
  root.addEventListener("click", (e) => {
    const b = e.target.closest(".rowbtn");
    if (!b) return;
    const row = document.getElementById(b.getAttribute("aria-controls"));
    const open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", open);
    if (row) row.hidden = !open;
  });
}

/* ------------------------------------------------------------------ shared bits */
function flagsList(flags, showFund) {
  if (!flags.length) return `<p class="empty">No alerts.</p>`;
  const lbl = { high: "Action", warn: "Check", info: "Note" };
  return `<ul class="flags">${flags.map((f) => `<li class="flag ${f.level}"><span class="fi">${ICON[f.level === "high" ? "high" : f.level === "warn" ? "warn" : "info"]}</span>
    <div><span class="lvl">${lbl[f.level]}</span>${showFund && f.fund_key ? `<a href="#/fund/${f.fund_key}">${esc(f.fund)}</a>: ` : ""}${esc(f.text)}</div></li>`).join("")}</ul>`;
}
const tile = (lbl, val, note, hero) => `<div class="tile ${hero ? "hero" : ""}"><div class="lbl">${lbl}</div><div class="val">${val}</div>${note ? `<div class="note">${note}</div>` : ""}</div>`;
const fundByKey = (k) => S.data.funds.find((f) => f.key === k);

/* ================================================================== PORTFOLIO PAGE */
function portfolioPage() {
  const d = S.data, P = d.portfolio, k = P.kpis;

      { h: "Purpose", r: (c) => esc(c.description || ""), sortable: false },
    ], P.upcoming) : ""), { meta: `${hi.length} to review` });

  // KPIs
  const irr = isNum(k.irr) ? pct(k.irr) : "n/a";
  h += card("kpis", "Your portfolio at a glance", `<div class="tiles">
    ${tile("Net asset value", moneyC(k.nav_usd), k.nav_estimated ? `${k.nav_estimated} fund NAV estimated` : "latest statements", true)}
    ${tile("Total commitment", moneyC(k.commitment_usd), `${k.funds} funds`)}
    ${tile("Paid-in capital", moneyC(k.paid_in_usd), `${pct(k.pct_called, 0)} called`)}
    ${tile("Unfunded commitment", moneyC(k.unfunded_usd), "still callable")}
    ${tile("Distributions", moneyC(k.distributions_usd), "cumulative")}
    ${tile("Total value", moneyC(k.total_value_usd), `gain ${moneyC(k.gain_usd)}`)}
    ${tile("TVPI", mult(k.tvpi), "total value / paid-in")}
    ${tile("DPI", mult(k.dpi), "distributions / paid-in")}
    ${tile("RVPI", mult(k.rvpi), "NAV / paid-in")}
    ${tile("Net IRR (yours)", irr, k.irr_note ? esc(k.irr_note) : "XIRR, all funds")}
  </div>` + (missing.length ? `<p class="hint small" style="margin-top:12px">Not in totals yet (no capital account statement or commitment): ${missing.map((f) => `<a href="#/fund/${f.key}">${esc(f.short)}</a>`).join(", ")}. Add their JPM statements to the folder, or set <code>my_commitment</code> in <code>app/data/funds.json</code>.</p>` : ""));

  // funds table
  const cols = [
    { h: "Fund", cls: "fund", r: (f) => `<a href="#/fund/${f.key}">${esc(f.short)}</a><div class="small muted">${esc(f.static.manager || "")}</div>`, v: (f) => f.short },
    { h: "Strategy", r: (f) => esc(f.static.strategy || "–"), v: (f) => f.static.strategy },
    { h: "Vintage", n: 1, r: (f) => esc(f.static.vintage || "–"), v: (f) => f.static.vintage },
    { h: "Commitment", n: 1, r: (f) => money(f.lp?.commitment, f.lp?.currency), v: (f) => f.lp?.commitment_usd },
    { h: "Paid-in", n: 1, r: (f) => money(f.lp?.paid_in, f.lp?.currency), v: (f) => f.lp?.paid_in_usd },
    { h: "% called", n: 1, r: (f) => pct(f.lp?.pct_called, 0), v: (f) => f.lp?.pct_called },
    { h: "Distributions", n: 1, r: (f) => money(f.lp?.distributions, f.lp?.currency), v: (f) => f.lp?.distributions_usd },
    { h: "NAV", n: 1, r: (f) => money(f.lp?.nav, f.lp?.currency) + (f.lp?.nav_estimated ? ` <span class="pill est" title="${esc(f.lp.nav_basis)}">est.</span>` : ""), v: (f) => f.lp?.nav_usd },

    { h: "TVPI", n: 1, r: (f) => mult(f.lp?.tvpi), v: (f) => f.lp?.tvpi },

  h += card("funds", "Funds", table("t-funds", cols, d.funds, { foot }) + `<p class="small muted" style="margin:8px 0 0">Click a fund for its tearsheet, portfolio companies and projections. Your figures come from the JPM conduit statements (net of all fees); fund IRR/MOIC are the GP's whole-fund numbers.</p>`, { meta: `${d.funds.length} funds` });

  if (P.nav_bridge && P.nav_bridge.funds) {
    const b = P.nav_bridge;
    const steps = [["Opening NAV", b.begin, "total"], ["Contributions", b.contributions], ["Distributions", b.distributions], ["Unrealized gains", b.unrealized],

    const fn = (t) => {
      let run = 0; const data = [], colors = [];

    };
    fn.label = "NAV bridge waterfall";
    h += card("bridge", `NAV bridge, quarter to ${fdate(b.quarter_end)}`, legend([[css("--muted"), "Opening / closing NAV"], [css("--s1"), "Increase"], [css("--s8"), "Decrease"]]) + chart("c-bridge", fn) +
      table("t-bridge", [{ h: "Step", r: (s) => s[0], sortable: false }, { h: "USD", n: 1, sortable: false, r: (s) => `<span class="${s[2] ? "" : cls(s[1])}">${s[2] ? money(s[1]) : (s[1] > 0 ? "+" : "") + money(s[1])}</span>` }], steps),

  // cash flows / J-curve

    const fn = (t) => ({ type: "bar", data: { labels: P.jcurve.map((q) => q.quarter), datasets: [

  if (P.projection.length) {
    const years = {};

    const fn = (t) => ({ type: "bar", data: { labels: ys, datasets: [

      options: { scales: scales(), plugins: { tooltip: { callbacks: { label: (c) => `Projected NAV: ${moneyC(c.raw)}` } } } } });
    navFn.label = "Projected NAV"; navFn.size = "short";
    const fc = fundColors();
    const next4 = P.projection.slice(0, 4);
    const keys = [...new Set(next4.flatMap((q) => Object.keys(q.by_fund)))];
    const rows = keys.map((key) => ({ key, f: fundByKey(key), q: next4.map((q) => q.by_fund[key] || 0) }));
    h += card("proj", "Projected cash flows (Takahashi-Alexander)", `<div class="two-col"><div>${legend([[css("--s2"), "Calls"], [css("--s1"), "Distributions"]])}${chart("c-proj", fn)}</div><div><div class="legend">Projected NAV of current commitments</div>${chart("c-projnav", navFn)}</div></div>

      { meta: `next 12 months: calls ${moneyC(P.projection.slice(0, 4).reduce((a, q) => a + q.calls, 0))}` });
  }

  // allocation
  const allocFn = (rows, label) => { const fn = (t) => ({ type: "bar", data: { labels: rows.map((r) => r.name), datasets: [

  if (P.by_strategy.length) {

  // look-through

    const fn = (t) => ({ type: "bar", data: { labels: sec.map((s) => s.name), datasets: [{ data: sec.map((s) => s.value), backgroundColor: t.series[0], borderRadius: 4, maxBarThickness: 18 }] },
      options: { indexAxis: "y", scales: { x: { grid: { color: css("--grid") }, border: { display: false }, ticks: { callback: (v) => moneyC(v) } }, y: { grid: { display: false }, ticks: { callback: shortLabel } } }, plugins: { tooltip: { callbacks: { label: (c) => moneyC(c.raw) } } } } });
    fn.label = "Look-through exposure by sector"; fn.size = "tall";

      table("t-look", [{ h: "Company", r: (c) => esc(c.company), v: (c) => c.company }, { h: "Fund", r: (c) => `<a href="#/fund/${c.fund_key}">${esc(c.fund)}</a>`, v: (c) => c.fund },
        { h: "Your share", n: 1, r: (c) => money(c.lookthrough_usd), v: (c) => c.lookthrough_usd }, { h: "MOIC", n: 1, r: (c) => mult(c.gross_moic), v: (c) => c.gross_moic }], top) +
      `</div></div><p class="small muted">Estimate: company fair value × (your NAV ÷ fund NAV). Only funds with both your NAV and the GP's holdings are included.</p>`, { span: 6, meta: `${P.lookthrough_top.length} companies` });
  }

  // open-ended
  const oe = d.funds.filter((f) => f.open_ended);
  if (oe.length) {
    h += card("oe", "Open-ended & hedge funds", table("t-oe", [
      { h: "Fund", r: (f) => `<a href="#/fund/${f.key}">${esc(f.short)}</a>`, v: (f) => f.short },
      { h: "As of", cls: "nowrap", r: (f) => fdate(f.open_ended.as_of), v: (f) => f.open_ended.as_of },
      { h: "MTD", n: 1, r: (f) => pct(f.open_ended.return_mtd, 2), v: (f) => f.open_ended.return_mtd },
      { h: "QTD", n: 1, r: (f) => pct(f.open_ended.return_qtd, 2), v: (f) => f.open_ended.return_qtd },
      { h: "YTD", n: 1, r: (f) => pct(f.open_ended.return_ytd, 2), v: (f) => f.open_ended.return_ytd },
      { h: "1 year", n: 1, r: (f) => pct(f.open_ended.return_1y, 2), v: (f) => f.open_ended.return_1y },
      { h: "3y ann.", n: 1, r: (f) => pct(f.open_ended.return_3y_ann, 2), v: (f) => f.open_ended.return_3y_ann },
      { h: "Since incep. ann.", n: 1, r: (f) => pct(f.open_ended.return_itd_ann, 2), v: (f) => f.open_ended.return_itd_ann },
      { h: "Volatility", n: 1, r: (f) => pct(f.open_ended.volatility, 1), v: (f) => f.open_ended.volatility },
      { h: "Sharpe", n: 1, r: (f) => (isNum(f.open_ended.sharpe) ? f.open_ended.sharpe.toFixed(2) : "–"), v: (f) => f.open_ended.sharpe }], oe) +
      `<p class="small muted">Time-weighted, net of fees as reported. IRR/TVPI do not apply to evergreen funds.</p>`, { span: 6 });
  }

  // documents
  h += docsCard(d.documents, "docs");
  h += methodologyCard();
  return h + "</div>";
}

function flagIcons(f) {
  const n = { high: 0, warn: 0 };
  f.flags.forEach((x) => { if (n[x.level] !== undefined) n[x.level]++; });
  return (n.high ? `<span class="pill" style="background:var(--flag-high-bg)" title="Action needed">${ICON.high} ${n.high}</span> ` : "") +
    (n.warn ? `<span class="pill" style="background:var(--flag-warn-bg)" title="Check">${ICON.warn} ${n.warn}</span>` : "");
}

function docsCard(docs, id, fundView) {
  const pend = docs.filter((x) => x.status === "pending" || x.notes === "awaiting extraction").length;
  const rows = docs.map((x) => ({ ...x, fund: x.fund_key ? (fundByKey(x.fund_key)?.short || x.fund_key) : "?" }));
  const cols = [
    { h: "Document", r: (x) => `${esc(fileLabel(x.files ? x.files[0] : x.file))}${x.files && x.files.length > 1 ? ` <span class="pill">${x.files.length} copies</span>` : ""}`, v: (x) => fileLabel(x.files ? x.files[0] : x.file) },
    ...(fundView ? [] : [{ h: "Fund", r: (x) => (x.fund_key ? `<a href="#/fund/${x.fund_key}">${esc(x.fund)}</a>` : "?"), v: (x) => x.fund }]),
    { h: "Type", r: (x) => DOC_TYPE[x.doc_type] || esc(x.doc_type), v: (x) => x.doc_type },
    { h: "Period", r: (x) => fdate(x.period_end), v: (x) => x.period_end },
    { h: "Status", r: (x) => { const s = x.status || (x.notes === "awaiting extraction" ? "pending" : "extracted");
        return `<span class="pill ${s === "pending" ? "est" : ""}">${s === "parsed" ? "parsed automatically" : s === "extracted" ? "extracted by Claude" : s === "pending" ? "awaiting extraction" : esc(s)}</span>`; }, v: (x) => x.status },
    ...(fundView ? [{ h: "Notes", sortable: false, r: (x) => `<span class="small ink2">${esc(x.notes === "awaiting extraction" ? "" : x.notes || "")}</span>` }] : []),
  ];
  const help = pend ? `<p class="hint small">${pend} report${pend > 1 ? "s" : ""} awaiting extraction. JPM statements and notices are read automatically; GP reports are read by Claude on demand: open Claude Code in the <b>AltInvestments</b> folder and run <code>/ingest-fund-reports</code>, then press Rescan.</p>` : "";
  return card(id, "Source documents", help + table("t-" + id, cols, rows, { sort: { i: fundView ? 2 : 3, dir: -1 } }), { open: false, meta: `${docs.length} documents${pend ? `, ${pend} pending` : ""}` });
}

function methodologyCard() {
  return card("method", "Definitions & methodology", `<div class="prose small">
    <p><b>Your position</b> comes from the J.P. Morgan conduit capital account statements and call/distribution notices: amounts you actually paid and received, net of every fee layer. <b>Fund</b> figures are the GP's whole-fund numbers for the master fund.</p>
    <ul>
      <li><b>Paid-in (PI)</b> = contributions inside + outside commitment. <b>Unfunded</b> = commitment − inside contributions + recallable distributions.</li>
      <li><b>DPI</b> = distributions ÷ PI · <b>RVPI</b> = NAV ÷ PI · <b>TVPI</b> = DPI + RVPI.</li>
      <li><b>Your net IRR</b> = XIRR of dated calls (−), distributions (+) and current NAV (+). Shown only when at least 90% of paid-in capital has a known date; "n.m." when held under a year (J-curve).</li>
      <li><b>Gross MOIC</b> = (realized + unrealized value) ÷ invested cost, before fees and carry. <b>Gross vs net IRR</b>: net is after management fees, expenses and carry. Check the net-IRR basis: subscription lines inflate IRR.</li>
      <li><b>Estimated NAV</b> (marked <span class="pill est">est.</span>): when only a notice is available, NAV ≈ paid-in × fund net TVPI − distributions.</li>
      <li><b>Look-through</b> = company fair value × (your NAV ÷ fund NAV).</li>
      <li><b>Projections</b>: Takahashi-Alexander (Yale, 2001), run quarterly with annual rates converted (1−(1−r)<sup>¼</sup>), re-seeded from the latest statement each time the app runs.</li>
      <li><b>Alerts</b>: calls due within 14 days; data older than 135 days (ILPA: 120 days for feeders); investment period ending within a year; figures that do not reconcile.</li>
    </ul>
    <p>Research notes: <code>app/docs/research-brief.md</code> (ILPA templates, LP dashboard conventions, metric definitions).</p></div>`, { open: false, global: true });
}

/* ================================================================== FUND PAGE */
function fundPage(key) {
  const d = S.data, f = fundByKey(key);
  if (!f) return `<p>Unknown fund. <a href="#/">Back</a></p>`;
  const st = f.static, lp = f.lp, fp = f.fund, ccy = fp?.currency || f.currency;
  const idx = d.funds.indexOf(f), prev = d.funds[idx - 1], next = d.funds[idx + 1];
  let h = `<div class="page-head"><div><h1>${esc(st.name || f.short)}</h1>
    <div class="sub">${[st.manager, st.strategy, st.vintage ? "Vintage " + st.vintage : null, f.currency, st.structure === "open_ended" ? "Open-ended" : "Closed-end"].filter(Boolean).map(esc).join(" · ")}</div>
    ${st.vehicle ? `<div class="small muted">Held via ${esc(st.vehicle)}</div>` : ""}</div>
    <div class="pager">${prev ? `<a class="btn" href="#/fund/${prev.key}" aria-label="Previous fund: ${esc(prev.short)}">${ICON.back}<span class="lbl-txt">${esc(prev.short)}</span></a>` : ""}${next ? `<a class="btn" href="#/fund/${next.key}" aria-label="Next fund: ${esc(next.short)}"><span class="lbl-txt">${esc(next.short)}</span>${ICON.next}</a>` : ""}</div></div><div class="grid">`;

  if (f.flags.length) h += card("flags", "Alerts", flagsList(f.flags), { meta: `${f.flags.filter((x) => x.level !== "info").length} to review` });

  // ---- your position
  if (lp) {
    const irr = isNum(lp.irr) ? pct(lp.irr) : "n/a";
    let body = `<div class="tiles">
      ${tile("Your NAV", money(lp.nav, lp.currency) + (lp.nav_estimated ? ' <span class="pill est">est.</span>' : ""), esc(lp.nav_basis || ""), true)}
      ${tile("Commitment", money(lp.commitment, lp.currency), lp.pct_of_conduit ? `${pct(lp.pct_of_conduit, 2)} of conduit` : "")}
      ${tile("Paid-in", money(lp.paid_in, lp.currency), `${pct(lp.pct_called, 1)} of commitment called`)}
      ${tile("Unfunded", money(lp.unfunded, lp.currency), lp.recallable ? `incl. ${money(lp.recallable, lp.currency)} recallable` : "")}
      ${tile("Distributions", money(lp.distributions, lp.currency), "cumulative")}
      ${tile("Gain / (loss)", `<span class="${cls(lp.gain)}">${money(lp.gain, lp.currency)}</span>`, "NAV + distributions − paid-in")}
      ${tile("TVPI", mult(lp.tvpi), `DPI ${mult(lp.dpi)} · RVPI ${mult(lp.rvpi)}`)}
      ${tile("Your net IRR", irr, esc(lp.irr_note || "XIRR"))}
    </div><p class="small muted" style="margin:8px 0 0">As of ${fdate(lp.as_of)}${lp.contrib_outside ? ` · paid-in includes ${money(lp.contrib_outside, lp.currency)} outside commitment (conduit costs)` : ""}.</p>`;
    if (lp.qtd) {
      const R = [["Beginning balance", "beginning_balance"], ["Contributions: investments", "contrib_investments"], ["Contributions: management fees", "contrib_management_fees"],
        ["Contributions: fund expenses", "contrib_expenses"], ["Contributions outside commitment", "contrib_outside_total"], ["Total contributions", "contributions_total", 1],
        ["Distributions", "distributions_total", 0, -1], ["Net realized gain/(loss)", "net_realized_gain"], ["Dividend income", "dividend_income"],
        ["Master-fund income & expenses (incl. fees)", "other_income_expense"], ["Change in unrealized value", "unrealized_change"], ["Net income from underlying fund", "underlying_net_income", 1],
        ["Conduit income/(expenses)", "feeder_income_expense"], ["Syndication costs", "syndication_costs"], ["Ending balance (NAV)", "ending_balance", 1]];
      body += `<h3 class="small muted" style="margin:16px 0 6px">Capital account roll-forward (ILPA-style)</h3><div class="table-wrap"><table class="t"><thead><tr><th>${esc(lp.currency)}</th><th class="n">Quarter</th><th class="n">Year to date</th><th class="n">Since inception</th></tr></thead><tbody>
        ${R.map(([l, k2, bold, sign]) => `<tr ${bold ? 'style="font-weight:650"' : ""}><td>${l}</td>${["qtd", "ytd", "itd"].map((p) => { const v = lp[p]?.[k2]; const vv = isNum(v) ? v * (sign || 1) : v; return `<td class="n">${isNum(vv) ? (vv < 0 ? `(${num(-vv)})` : num(vv)) : "–"}</td>`; }).join("")}</tr>`).join("")}
        </tbody></table></div>`;
    }
    if (lp.fees) {
      const fe = Object.entries(lp.fees).filter(([, v]) => isNum(v) && v !== 0);
      body += `<h3 class="small muted" style="margin:16px 0 6px">Fees & costs since inception (what the statement shows)</h3>` +
        `<div class="table-wrap"><table class="t"><tbody>${fe.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="n">${money(v, lp.currency)}</td></tr>`).join("")}</tbody></table></div>
        <p class="small muted">"Master-fund income & expenses" is the net of your share of the master fund's management fees, expenses and income. Carry is inside the unrealized line.</p>`;
    }
    if (lp.history && lp.history.length >= 2) {
      const H = lp.history;
      const fn = (t) => ({ type: "line", data: { labels: H.map((x) => x.period_end), datasets: [
        { label: "TVPI", data: H.map((x) => x.tvpi), borderColor: t.series[0], backgroundColor: t.series[0], borderWidth: 2, pointRadius: 3 },
        { label: "DPI", data: H.map((x) => x.dpi), borderColor: t.series[1], backgroundColor: t.series[1], borderWidth: 2, pointRadius: 3 }] },
        options: { scales: scales({ ytick: (v) => v.toFixed(1) + "x" }), interaction: { mode: "index", intersect: false }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${mult(c.raw)}` } } } } });
      fn.label = "TVPI and DPI over time"; fn.size = "short";
      body += `<h3 class="small muted" style="margin:16px 0 6px">Multiples over time</h3>` + legend([[css("--s1"), "TVPI"], [css("--s2"), "DPI"]]) + chart("c-lphist", fn);
    } else body += `<p class="small muted" style="margin-top:12px">History charts appear once two or more quarterly statements are in the folder.</p>`;
    if ((lp.cashflows || []).length || (lp.upcoming || []).length) {
      const flows = (lp.upcoming || []).map((c) => ({ ...c, source: "notice", upcoming: true })).concat((lp.cashflows || []).slice().reverse());
      body += `<h3 class="small muted" style="margin:16px 0 6px">Your cash flows</h3>` + table("t-lpcf", [
        { h: "Date", r: (c) => fdate(c.date) + (c.upcoming ? ' <span class="pill est">upcoming</span>' : "") + (c.estimated ? ' <span class="pill est" title="Date unknown: placed at the midpoint of the period before your first statement">est. date</span>' : ""), v: (c) => c.date },
        { h: "Type", r: (c) => (c.type === "call" ? "Capital call" : "Distribution"), v: (c) => c.type },
        { h: "Amount", n: 1, r: (c) => `<span class="${c.type === "call" ? "down" : "up"}">${c.type === "call" ? "−" : "+"}${money(c.amount, lp.currency)}</span>`, v: (c) => (c.type === "call" ? -c.amount : c.amount) },
        { h: "Source", r: (c) => esc(c.source === "statement" ? "statement (quarter total)" : c.source), v: (c) => c.source }], flows);
    }
    h += card("lp", "Your position", body, { meta: lp.as_of ? `as of ${fdate(lp.as_of)}` : "" });
  } else {
    h += card("lp", "Your position", `<p class="hint">Your commitment to this fund isn't known yet. Add the J.P. Morgan capital account statement (or a call/distribution notice) to the AltInvestments folder and press Rescan, or set <code>my_commitment</code> for <code>${esc(f.key)}</code> in <code>app/data/funds.json</code>.</p>`);
  }

  // ---- fund overview (GP tearsheet, modelled on the "Fund Overview" layout)
  if (fp || st.name) {
    const fx = ccy && ccy !== "USD" ? `<tr><td>${esc(ccy)}/USD at reporting date</td><td>${fp?.fx_note ? esc(fp.fx_note) : "see FX table"}</td></tr>` : "";
    const totalDrawn = isNum(fp?.paid_in_capital) ? fp.paid_in_capital + (fp.credit_facility_drawn || 0) : null;
    const unf = fp?.unfunded_commitment ?? (isNum(fp?.committed_capital) && isNum(fp?.paid_in_capital) ? fp.committed_capital - fp.paid_in_capital : null);
    const chk = (rep, calc) => (isNum(rep) && isNum(calc) ? (Math.abs(rep - calc) <= 0.051 ? `<span class="chk up" title="Recomputed ${calc.toFixed(2)}">✓</span>` : `<span class="chk down" title="Recomputed ${calc.toFixed(3)}">⚠ ${calc.toFixed(2)} computed</span>`) : "");
    const row = (l, v, e) => (v && v !== "–" ? `<tr class="${e || ""}"><td>${l}</td><td>${v}</td></tr>` : "");
    const ipe = st.investment_period_end;
    let kv = `<table class="kv"><tbody>
      ${row("Limited partnership", esc(st.name))}${row("Your vehicle", esc(st.vehicle || ""))}${row("Manager", esc(st.manager || ""))}
      ${row("Strategy / focus", esc([st.strategy, st.geography, st.sector_focus].filter(Boolean).join(" · ")))}
      ${row("Vintage", esc(st.vintage || ""))}${row("First close", st.first_close ? fdate(st.first_close) : "")}${row("Final close", st.final_close ? fdate(st.final_close) : "")}
      ${row("Total committed capital", fp?.committed_capital ? money(fp.committed_capital, ccy) : (st.fund_size ? money(st.fund_size, ccy) : ""))}
      ${row("Investment period ends", ipe ? fdate(ipe) + (daysOld(ipe) < 0 ? ` <span class="muted">(in ${-daysOld(ipe)} days)</span>` : ` <span class="muted">(ended)</span>`) : "")}
      ${row("Term ends", st.term_end ? fdate(st.term_end) : "")}`;
    if (fp) {
      kv += `<tr class="band"><td>Reporting date</td><td>${fdate(fp.period_end)} <span class="muted">(${daysOld(fp.period_end)} days ago)</span></td></tr>${fx}
      ${row("Total paid-in capital (PI)", money(fp.paid_in_capital, ccy))}
      ${row("Credit facility drawn", isNum(fp.credit_facility_drawn) ? money(fp.credit_facility_drawn, ccy) : "")}
      ${row("Total drawn (PI + credit facility)", isNum(fp.credit_facility_drawn) && isNum(totalDrawn) ? money(totalDrawn, ccy) : "")}
      ${row("Unfunded commitment", isNum(unf) ? `${money(unf, ccy)} <span class="muted">(${pct(fp.committed_capital ? 1 - unf / fp.committed_capital : null, 0)} called)</span>` : "")}
      ${row("Total investments (cost)", money(fp.invested_cost, ccy))}
      ${row("Realized proceeds", money(fp.realized_proceeds, ccy))}
      ${row("FMV of unrealized portfolio", money(fp.unrealized_value, ccy))}
      ${row("Residual value (NAV)", money(fp.nav, ccy))}
      ${row("Cumulative distributions", money(fp.cumulative_distributions, ccy))}
      ${row("Investments (realized)", isNum(fp.num_investments) ? `${fp.num_investments}${isNum(fp.num_realized) ? ` (${fp.num_realized} realized)` : ""}` : "")}
      <tr class="band em"><td>Gross MOIC</td><td>${mult(fp.gross_moic)} ${chk(fp.gross_moic, isNum(fp.total_value) && fp.invested_cost ? fp.total_value / fp.invested_cost : null)}</td></tr>
      <tr class="em"><td>Gross IRR</td><td>${pct(fp.gross_irr)}</td></tr>
      ${row("Net IRR", isNum(fp.net_irr) ? `${pct(fp.net_irr)} <span class="muted small">${esc(fp.net_irr_basis || "basis not stated")}</span>` : "")}
      ${row("Net IRR without credit line", isNum(fp.net_irr_unlevered) ? pct(fp.net_irr_unlevered) : "")}
      ${row("Net MOIC", mult(fp.net_moic))}
      ${row("DPI", isNum(fp.dpi) ? mult(fp.dpi) + chk(fp.dpi, fp.dpi_calc) : (isNum(fp.dpi_calc) ? mult(fp.dpi_calc) + ' <span class="muted small">computed</span>' : ""))}
      ${row("RVPI", isNum(fp.rvpi) ? mult(fp.rvpi) + chk(fp.rvpi, fp.rvpi_calc) : (isNum(fp.rvpi_calc) ? mult(fp.rvpi_calc) + ' <span class="muted small">computed</span>' : ""))}
      ${row("TVPI", isNum(fp.tvpi) ? mult(fp.tvpi) + chk(fp.tvpi, isNum(fp.dpi) && isNum(fp.rvpi) ? fp.dpi + fp.rvpi : null) : "")}`;
    }
    kv += `</tbody></table>`;
    if (lp && fp && isNum(lp.irr) && isNum(fp.net_irr)) kv += `<p class="small muted">Your IRR vs fund net IRR: ${pct(lp.irr - fp.net_irr)} difference (conduit fees and timing).</p>`;
    if (f.fund_history.length >= 2) {
      const H = f.fund_history;
      kv += `<h3 class="small muted" style="margin:16px 0 6px">Reported history</h3>` + table("t-fhist", [
        { h: "Period", r: (p) => fdate(p.period_end), v: (p) => p.period_end }, { h: "NAV", n: 1, r: (p) => moneyC(p.nav, ccy), v: (p) => p.nav },
        { h: "Gross IRR", n: 1, r: (p) => pct(p.gross_irr), v: (p) => p.gross_irr }, { h: "Net IRR", n: 1, r: (p) => pct(p.net_irr), v: (p) => p.net_irr },
        { h: "Gross MOIC", n: 1, r: (p) => mult(p.gross_moic), v: (p) => p.gross_moic }, { h: "TVPI", n: 1, r: (p) => mult(p.tvpi ?? p.net_moic), v: (p) => p.tvpi }], H.slice().reverse());
    }
    h += card("overview", "Fund overview (as reported by the GP)", kv, { span: 6, meta: fp ? fdate(fp.period_end) : "" });
  }

  // ---- commentary
  if (f.commentary.length) {
    const c = f.commentary[0];
    const li = (arr, fn) => (arr && arr.length ? `<ul>${arr.map(fn).join("")}</ul>` : "");
    let body = `<div class="prose">${c.summary ? `<p>${esc(c.summary)}</p>` : ""}
      ${c.highlights?.length ? `<h3>Highlights</h3>${li(c.highlights, (x) => `<li>${esc(x)}</li>`)}` : ""}
      ${c.new_investments?.length ? `<h3>New investments</h3>${li(c.new_investments, (x) => `<li><b>${esc(x.company)}</b>${x.date ? ` (${fdate(x.date)})` : ""}${isNum(x.amount) ? ` · ${moneyC(x.amount, ccy)}` : ""}${x.text ? ` – ${esc(x.text)}` : ""}</li>`)}` : ""}
      ${c.exits?.length ? `<h3>Exits & realizations</h3>${li(c.exits, (x) => `<li><b>${esc(x.company)}</b>${x.date ? ` (${fdate(x.date)})` : ""}${isNum(x.proceeds) ? ` · ${moneyC(x.proceeds, ccy)}` : ""}${isNum(x.moic) ? ` · ${mult(x.moic)}` : ""}${x.text ? ` – ${esc(x.text)}` : ""}</li>`)}` : ""}
      ${c.outlook ? `<h3>Outlook</h3><p>${esc(c.outlook)}</p>` : ""}
      ${c.risks?.length ? `<h3>Risks & watch items</h3>${li(c.risks, (x) => `<li>${esc(x)}</li>`)}` : ""}
      ${f.expected_cashflows.length ? `<h3>GP cash-flow guidance</h3>${li(f.expected_cashflows, (x) => `<li>${x.type === "call" ? "Call" : "Distribution"}${x.date ? " " + fdate(x.date) : ""}${isNum(x.amount) ? " · " + moneyC(x.amount, ccy) : ""}${x.text ? " – " + esc(x.text) : ""}</li>`)}` : ""}</div>`;
    if (f.commentary.length > 1) body += `<details style="margin-top:8px"><summary class="small" style="cursor:pointer;min-height:32px">Earlier / other commentary (${f.commentary.length - 1})</summary><div class="prose small">${f.commentary.slice(1).map((x) => `<p><b>${fdate(x.period_end)} · ${DOC_TYPE[x.doc_type] || ""}</b><br>${esc(x.summary || "")}</p>`).join("")}</div></details>`;
    h += card("commentary", "Manager commentary", body, { span: 6, meta: `${fdate(c.period_end)} · ${DOC_TYPE[c.doc_type] || ""}` });
  }

  // ---- projection
  if (f.projection) {
    const rows = f.projection.rows, years = {};
    rows.forEach((r) => { const y = r.quarter_end.slice(0, 4); years[y] = years[y] || { call: 0, distribution: 0, nav: 0 }; years[y].call += r.call; years[y].distribution += r.distribution; years[y].nav = r.nav; });
    const ys = Object.keys(years).slice(0, 11);
    const fn = (t) => ({ type: "bar", data: { labels: ys, datasets: [
      { label: "Distributions", data: ys.map((y) => years[y].distribution), backgroundColor: t.series[0], borderRadius: 4, maxBarThickness: 26 },
      { label: "Calls", data: ys.map((y) => -years[y].call), backgroundColor: t.series[1], borderRadius: 4, maxBarThickness: 26 },
      { type: "line", label: "NAV", data: ys.map((y) => years[y].nav), borderColor: css("--ink-2"), backgroundColor: css("--ink-2"), borderWidth: 2, pointRadius: 2 }] },
      options: { scales: scales({ ccy: lp.currency }), interaction: { mode: "index", intersect: false }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${money(Math.abs(c.raw), lp.currency)}` } } } } });
    fn.label = "Projected calls, distributions and NAV";
    const p = f.projection.params;
    h += card("proj", "Projected cash flows", legend([[css("--s2"), "Calls"], [css("--s1"), "Distributions"], [css("--ink-2"), "NAV"]]) + chart("c-fproj", fn) +
      `<p class="small muted">Takahashi-Alexander, ${esc(st.strategy || "Buyout")} parameters: growth ${pct(p.g, 0)}, life ${p.l} yrs, bow ${p.b}, yield ${pct(p.y, 0)}, contribution rates ${p.rc.map((x) => pct(x, 0)).join(" / ")}; fund age ${f.projection.age_years} yrs.
      Next 4 quarters: calls ${money(f.projection.next_4q_calls, lp.currency)}, distributions ${money(f.projection.next_4q_distributions, lp.currency)}.</p>`, { span: 6 });
  }

  // ---- holdings
  if (f.holdings.length) {
    const H = f.holdings, hc = H[0].currency || ccy;
    const top = H.filter((x) => isNum(x.unrealized_value) && x.unrealized_value > 0).sort((a, b) => b.unrealized_value - a.unrealized_value).slice(0, 12);
    const fn = (t) => ({ type: "bar", data: { labels: top.map((x) => x.company), datasets: [
      { label: "Cost", data: top.map((x) => x.invested_cost), backgroundColor: t.series[2], borderRadius: 4, maxBarThickness: 14 },
      { label: "Fair value", data: top.map((x) => x.unrealized_value), backgroundColor: t.series[0], borderRadius: 4, maxBarThickness: 14 }] },
      options: { indexAxis: "y", scales: { x: { grid: { color: css("--grid") }, border: { display: false }, ticks: { callback: (v) => moneyC(v, hc) } }, y: { grid: { display: false }, ticks: { callback: shortLabel } } },
        interaction: { mode: "index", intersect: false }, plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${moneyC(c.raw, hc)}` } } } } });
    fn.label = "Largest holdings: cost vs fair value"; fn.size = "tall";
    const hasLook = H.some((x) => isNum(x.lookthrough_usd));
    const cols = [
      { h: "", sortable: false, r: () => "" },
      { h: "Company", r: (x) => esc(x.company), v: (x) => x.company },
      { h: "Sector", r: (x) => esc(x.sector || "–"), v: (x) => x.sector },
      { h: "Country", r: (x) => esc(x.country || x.region || "–"), v: (x) => x.country || x.region },
      { h: "Status", r: (x) => esc((x.status || "").replace("_", " ")), v: (x) => x.status },
      { h: "Invested", r: (x) => fdate(x.investment_date), v: (x) => x.investment_date },
      { h: "Cost", n: 1, r: (x) => moneyC(x.invested_cost, x.currency || hc), v: (x) => x.invested_cost },
      { h: "Realized", n: 1, r: (x) => moneyC(x.realized_proceeds, x.currency || hc), v: (x) => x.realized_proceeds },
      { h: "Unrealized", n: 1, r: (x) => moneyC(x.unrealized_value, x.currency || hc), v: (x) => x.unrealized_value },
      { h: "QoQ", n: 1, r: (x) => `<span class="${cls(x.qoq_change)}">${isNum(x.qoq_change) ? signed(x.qoq_change, (v) => moneyC(v, x.currency || hc)) : "–"}</span>`, v: (x) => x.qoq_change },
      { h: "MOIC", n: 1, r: (x) => mult(x.gross_moic), v: (x) => x.gross_moic },
      { h: "IRR", n: 1, r: (x) => pct(x.gross_irr), v: (x) => x.gross_irr },
      ...(hasLook ? [{ h: "Your share", n: 1, title: "Look-through estimate, USD", r: (x) => money(x.lookthrough_usd), v: (x) => x.lookthrough_usd }] : []),
    ];
    const rowHtml = (x, i) => {
      const id = `hd-${i}-${(x.company || "").replace(/\W/g, "").slice(0, 20)}`;
      const kpi = [["Revenue", x.revenue && moneyC(x.revenue, x.currency || hc)], ["EBITDA", x.ebitda && moneyC(x.ebitda, x.currency || hc)], ["Revenue growth", isNum(x.revenue_growth) && pct(x.revenue_growth)],
        ["EBITDA growth", isNum(x.ebitda_growth) && pct(x.ebitda_growth)], ["Net debt / EBITDA", isNum(x.net_debt_to_ebitda) && x.net_debt_to_ebitda.toFixed(1) + "x"], ["EV / EBITDA", isNum(x.ev_to_ebitda) && x.ev_to_ebitda.toFixed(1) + "x"],
        ["Ownership", isNum(x.ownership_pct) && pct(x.ownership_pct)], ["% of fund value", isNum(x.pct_of_fund_value) && pct(x.pct_of_fund_value)], ["Valuation method", x.valuation_method && esc(x.valuation_method)],
        ["Exit date", x.exit_date && fdate(x.exit_date)]].filter(([, v]) => v);
      const has = x.description || x.commentary || kpi.length || x.kpi_note;
      return `<tr><td>${has ? `<button class="rowbtn" aria-expanded="false" aria-controls="${id}" aria-label="Details for ${esc(x.company)}">${ICON.chev}</button>` : ""}</td>${cols.slice(1).map((c) => `<td class="${c.n ? "n" : ""}">${c.r(x)}</td>`).join("")}</tr>` +
        (has ? `<tr class="detail" id="${id}" hidden><td></td><td colspan="${cols.length - 1}"><div class="prose small">${x.description ? `<p><b>${esc(x.description)}</b></p>` : ""}${x.commentary ? `<p>${esc(x.commentary)}</p>` : ""}
        ${kpi.length ? `<p>${kpi.map(([l, v]) => `<span class="pill" style="margin:0 4px 4px 0">${l}: ${v}</span>`).join("")}</p>` : ""}${x.kpi_note ? `<p class="muted">${esc(x.kpi_note)}</p>` : ""}</div></td></tr>` : "");
    };
    const tc = H.reduce((a, x) => a + (x.invested_cost || 0), 0), tu = H.reduce((a, x) => a + (x.unrealized_value || 0), 0), tr = H.reduce((a, x) => a + (x.realized_proceeds || 0), 0);
    h += card("holdings", "Portfolio companies", (top.length >= 2 ? legend([[css("--s3"), "Cost"], [css("--s1"), "Fair value"]]) + chart("c-hold", fn) : "") +
      table("t-hold", cols, H, { rowHtml, sort: { i: 8, dir: -1 }, foot: `<tr><td></td><td>Total (${H.length})</td><td></td><td></td><td></td><td></td><td class="n">${moneyC(tc, hc)}</td><td class="n">${moneyC(tr, hc)}</td><td class="n">${moneyC(tu, hc)}</td><td></td><td class="n">${tc ? mult((tu + tr) / tc) : "–"}</td><td></td>${hasLook ? "<td></td>" : ""}</tr>` }) +
      `<p class="small muted">Whole-fund figures from the GP report of ${fdate(f.holdings_as_of)}. Tap a row's arrow for description, KPIs and commentary.</p>`, { meta: `${H.length} positions · ${fdate(f.holdings_as_of)}` });
  }

  // ---- open-ended
  if (f.open_ended) {
    const o = f.open_ended;
    const R = [["Month", "return_mtd"], ["Quarter", "return_qtd"], ["Year to date", "return_ytd"], ["1 year", "return_1y"], ["3 years ann.", "return_3y_ann"], ["5 years ann.", "return_5y_ann"], ["Since inception ann.", "return_itd_ann"], ["Since inception cum.", "return_itd_cum"]];
    let body = `<div class="tiles">${R.filter(([, k2]) => isNum(o[k2])).map(([l, k2]) => tile(l, `<span class="${cls(o[k2])}">${pct(o[k2], 2)}</span>`)).join("")}
      ${isNum(o.volatility) ? tile("Volatility", pct(o.volatility)) : ""}${isNum(o.sharpe) ? tile("Sharpe", o.sharpe.toFixed(2)) : ""}${isNum(o.max_drawdown) ? tile("Max drawdown", pct(o.max_drawdown)) : ""}
      ${isNum(o.aum) ? tile("Fund AUM", moneyC(o.aum, ccy)) : ""}${isNum(o.nav_per_unit) ? tile("NAV / unit", o.nav_per_unit.toFixed(2)) : ""}</div>
      <p class="small muted">${esc(o.share_class || "")} · as of ${fdate(o.as_of)}${o.inception_date ? ` · inception ${fdate(o.inception_date)}` : ""}</p>`;
    if (o.benchmarks?.length) body += table("t-bm", [{ h: "Benchmark", r: (b) => esc(b.name), v: (b) => b.name }, { h: "YTD", n: 1, r: (b) => pct(b.return_ytd, 2), v: (b) => b.return_ytd },
      { h: "1 year", n: 1, r: (b) => pct(b.return_1y, 2), v: (b) => b.return_1y }, { h: "Since incep. ann.", n: 1, r: (b) => pct(b.return_itd_ann, 2), v: (b) => b.return_itd_ann }], [{ name: "This fund", return_ytd: o.return_ytd, return_1y: o.return_1y, return_itd_ann: o.return_itd_ann }].concat(o.benchmarks));
    if (o.periodic_returns?.length) {
      const pr = o.periodic_returns.slice(-36);
      const fn = (t) => ({ type: "bar", data: { labels: pr.map((r) => r.period), datasets: [{ data: pr.map((r) => r.return), backgroundColor: pr.map((r) => (r.return >= 0 ? t.series[0] : t.series[7])), borderRadius: 3, maxBarThickness: 18 }] },
        options: { scales: scales({ ytick: (v) => (v * 100).toFixed(1) + "%" }), plugins: { tooltip: { callbacks: { label: (c) => pct(c.raw, 2) } } } } });
      fn.label = "Periodic net returns"; fn.size = "short";
      body += `<h3 class="small muted" style="margin:16px 0 6px">Net returns by period</h3>` + legend([[css("--s1"), "Positive"], [css("--s8"), "Negative"]]) + chart("c-oe", fn);
    }
    if (o.exposures?.length) {
      const ex = o.exposures.slice(0, 14);
      const fn = (t) => ({ type: "bar", data: { labels: ex.map((e) => e.name), datasets: [{ data: ex.map((e) => e.weight), backgroundColor: t.series[0], borderRadius: 4, maxBarThickness: 16 }] },
        options: { indexAxis: "y", scales: { x: { grid: { color: css("--grid") }, border: { display: false }, ticks: { callback: (v) => (v * 100).toFixed(0) + "%" } }, y: { grid: { display: false }, ticks: { callback: shortLabel } } }, plugins: { tooltip: { callbacks: { label: (c) => pct(c.raw, 1) } } } } });
      fn.label = "Exposures"; fn.size = "tall";
      body += `<h3 class="small muted" style="margin:16px 0 6px">Exposures</h3>` + chart("c-exp", fn);
    }
    h += card("oe", "Returns & exposures (open-ended fund)", body);
  }

  // ---- fund-level cash flow history
  if (f.fund_cashflows.length) {
    h += card("fcf", "Fund-level drawdown & distribution history", table("t-fcf", [{ h: "Date", r: (c) => fdate(c.date), v: (c) => c.date }, { h: "Type", r: (c) => (c.type === "call" ? "Drawdown" : "Distribution"), v: (c) => c.type },
      { h: "Amount", n: 1, r: (c) => money(c.amount, ccy), v: (c) => c.amount }, { h: "Description", r: (c) => esc(c.description || ""), sortable: false }], f.fund_cashflows), { open: false, meta: `${f.fund_cashflows.length} rows, whole fund` });
  }

  // ---- checks + documents
  if (f.reconciliation.length) h += card("recon", "Data checks", table("t-recon", [{ h: "Check", r: (r) => esc(r.check), v: (r) => r.check }, { h: "Period", r: (r) => fdate(r.period_end) },
    { h: "Reported", n: 1, r: (r) => r.reported.toLocaleString("en-US", { maximumFractionDigits: 3 }) }, { h: "Computed", n: 1, r: (r) => r.computed.toLocaleString("en-US", { maximumFractionDigits: 3 }) }], f.reconciliation), { open: false });
  h += docsCard(f.documents.map((x) => ({ ...x, files: [x.file], status: x.notes === "awaiting extraction" ? "pending" : (x.extracted_by || "").startsWith("parser") ? "parsed" : "extracted" })), "fdocs", true);
  return h + "</div>";
}

/* ================================================================== EXCEL */
function buildWorkbook() {
  const d = S.data, wb = XLSX.utils.book_new();
  const add = (name, rows) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ note: "no data" }]); XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31)); };
  const k = d.portfolio.kpis;
  add("Summary", [{ Metric: "As of (built)", Value: d.generated_at }, { Metric: "Commitment USD", Value: k.commitment_usd }, { Metric: "Paid-in USD", Value: k.paid_in_usd },
    { Metric: "Distributions USD", Value: k.distributions_usd }, { Metric: "NAV USD", Value: k.nav_usd }, { Metric: "Unfunded USD", Value: k.unfunded_usd },
    { Metric: "DPI", Value: k.dpi }, { Metric: "RVPI", Value: k.rvpi }, { Metric: "TVPI", Value: k.tvpi }, { Metric: "Net IRR", Value: k.irr }, { Metric: "Funds in totals", Value: k.funds }]);
  add("Funds", d.funds.map((f) => ({ Fund: f.short, Name: f.static.name, Manager: f.static.manager, Vehicle: f.static.vehicle, Strategy: f.static.strategy, Structure: f.static.structure,
    Vintage: f.static.vintage, Currency: f.currency, "Your as-of": f.lp?.as_of, Commitment: f.lp?.commitment, "Paid-in": f.lp?.paid_in, "% called": f.lp?.pct_called,
    Distributions: f.lp?.distributions, NAV: f.lp?.nav, "NAV basis": f.lp?.nav_basis, Unfunded: f.lp?.unfunded, DPI: f.lp?.dpi, RVPI: f.lp?.rvpi, TVPI: f.lp?.tvpi, "Your IRR": f.lp?.irr,
    "IRR note": f.lp?.irr_note, "Fund period": f.fund?.period_end, "Fund gross IRR": f.fund?.gross_irr, "Fund net IRR": f.fund?.net_irr, "Net IRR basis": f.fund?.net_irr_basis,
    "Fund gross MOIC": f.fund?.gross_moic, "Fund net MOIC": f.fund?.net_moic, "Fund TVPI": f.fund?.tvpi, "Fund DPI": f.fund?.dpi, "Fund NAV": f.fund?.nav,
    "Fund committed": f.fund?.committed_capital, "Fund paid-in": f.fund?.paid_in_capital, "Credit facility drawn": f.fund?.credit_facility_drawn })));
  add("LP history", d.funds.flatMap((f) => (f.lp?.history || []).map((x) => ({ Fund: f.short, ...x }))));
  add("LP cash flows", d.funds.flatMap((f) => (f.lp?.upcoming || []).map((c) => ({ Fund: f.short, Date: c.date, Type: c.type, Amount: c.amount, Status: "upcoming", Description: c.description }))
    .concat((f.lp?.cashflows || []).map((c) => ({ Fund: f.short, Date: c.date, Type: c.type, Amount: c.amount, Status: c.estimated ? "estimated date" : "actual", Source: c.source })))));
  add("Roll-forward", d.funds.filter((f) => f.lp?.qtd).flatMap((f) => ["qtd", "ytd", "itd"].map((p) => ({ Fund: f.short, Period: p.toUpperCase(), "As of": f.lp.as_of, ...f.lp[p] }))));
  add("Fund performance", d.funds.flatMap((f) => f.fund_history.map((p) => { const { sources, ...rest } = p; return { Fund: f.short, ...rest }; })));
  add("Holdings", d.funds.flatMap((f) => f.holdings.map((x) => ({ Fund: f.short, "As of": f.holdings_as_of, ...x }))));
  add("Projections", d.funds.flatMap((f) => (f.projection?.rows || []).map((r) => ({ Fund: f.short, ...r }))));
  add("Open-ended returns", d.funds.flatMap((f) => (f.open_ended?.periodic_returns || []).map((r) => ({ Fund: f.short, ...r }))));
  add("Alerts", d.portfolio.flags.map((x) => ({ Fund: x.fund, Level: x.level, Alert: x.text })));
  add("Documents", d.documents.map((x) => ({ File: fileLabel(x.files[0]), Fund: x.fund_key, Type: x.doc_type, Period: x.period_end, Status: x.status, Pages: x.pages, SHA256: x.sha256 })));
  return wb;
}
function exportExcel() {
  if (!window.XLSX) { alert("Excel library did not load (offline?)."); return; }
  XLSX.writeFile(buildWorkbook(), `AltInvestments_${S.data.today}.xlsx`);
}
window.AltInv = { buildWorkbook, render };

/* ================================================================== PRINT */
let printState = null;
function beforePrint() {
  printState = $$("details").map((d) => [d, d.open]);
  $$("details").forEach((d) => { d.open = true; });
  resizeCharts();
}
function afterPrint() { if (printState) printState.forEach(([d, o]) => { d.open = o; }); printState = null; resizeCharts(); }
window.addEventListener("beforeprint", beforePrint);
window.addEventListener("afterprint", afterPrint);

/* ================================================================== SHELL */
function shell() {
  const d = S.data;
  const crumbs = S.route[0] === "fund" ? `<a href="#/">Portfolio</a> › ${esc(fundByKey(S.route[1])?.short || "")}` : "Portfolio";
  $("#crumbs").innerHTML = crumbs;
  const p = d.pending_count;
  $("#pending").innerHTML = p ? `<a href="#/" class="btn" title="Reports awaiting Claude extraction" onclick="setTimeout(()=>{const x=document.querySelector('[data-key=\\'home:docs\\']');if(x){x.open=true;x.scrollIntoView()}},50)"><span class="badge">${p}</span><span class="lbl-txt">pending</span></a>` : "";
  $("#asof").textContent = `data ${fdate(d.generated_at.slice(0, 10))}`;
}
function render() {
  if (!S.data) return;
  const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  S.route = h;
  destroyCharts();
  S.tables = {};
  const main = $("#main");
  main.innerHTML = h[0] === "fund" ? fundPage(h[1]) : portfolioPage();
  shell();
  wireCards(main);
  wireTables(main);
  drawCharts();
  document.title = (h[0] === "fund" ? (fundByKey(h[1])?.short || "Fund") + " · " : "") + "Alt Investments";
}

async function rescan(btn) {
  btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = ICON.refresh + '<span class="lbl-txt">Scanning…</span>';
  try {
    const r = await fetch("api/rescan", { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    S.data = await (await fetch("api/data", { cache: "no-store" })).json();
    render();
  } catch (e) { alert("Rescan failed: " + e.message); }
  btn.disabled = false; btn.innerHTML = old;
}

function toolbar() {
  const t = $("#tools");
  t.innerHTML = `${MODE === "full" ? `<button class="btn" id="btn-rescan" title="Check the folder for new reports">${ICON.refresh}<span class="lbl-txt">Rescan</span></button>` : ""}
    <button class="btn" id="btn-expand" title="Expand all sections">${ICON.expand}<span class="lbl-txt">Expand all</span></button>
    <button class="btn" id="btn-collapse" title="Collapse all sections">${ICON.collapse}<span class="lbl-txt">Collapse all</span></button>
    <button class="btn" id="btn-xlsx" title="Export to Excel">${ICON.excel}<span class="lbl-txt">Excel</span></button>
    <button class="btn" id="btn-print" title="Print or save as PDF">${ICON.print}<span class="lbl-txt">PDF</span></button>
    <button class="btn" id="btn-theme"></button>`;
  applyTheme(store.get("theme"));
  $("#btn-theme").onclick = () => { const t2 = currentDark() ? "light" : "dark"; store.set("theme", t2); applyTheme(t2); render(); };
  $("#btn-expand").onclick = () => setAll(true);
  $("#btn-collapse").onclick = () => setAll(false);
  $("#btn-xlsx").onclick = exportExcel;
  $("#btn-print").onclick = () => { beforePrint(); setTimeout(() => window.print(), 300); };
  if (MODE === "full") $("#btn-rescan").onclick = (e) => rescan(e.currentTarget);
}

/* ------------------------------------------------------------------ encrypted static page */
async function decryptPayload(password) {
  const p = JSON.parse(document.getElementById("payload").textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen() {
  return new Promise((resolve) => {
    const saved = store.get("pw");
    const tryPw = async (pw, remember) => {
      try { const d = await decryptPayload(pw); if (remember) store.set("pw", pw); resolve(d); return true; } catch (e) { return false; }
    };
    if (saved) tryPw(saved, false).then((ok) => { if (!ok) show(); }); else show();
    function show() {
      $("#main").innerHTML = `<form class="lock" id="lock"><h1 style="font-size:18px;margin:0 0 4px">Alt Investments</h1><p class="muted small" style="margin:0">This page is encrypted. Enter your password to decrypt it in this browser.</p>
        <label class="sr-only" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
        <label class="small"><input type="checkbox" id="rem"> Remember on this device</label><div style="margin-top:12px"><button class="btn primary" type="submit">Unlock</button> <span id="err" class="down small"></span></div></form>`;
      $("#lock").onsubmit = async (e) => { e.preventDefault(); if (!(await tryPw($("#pw").value, $("#rem").checked))) $("#err").textContent = "Wrong password."; };
      $("#pw").focus();
    }
  });
}

async function init() {
  toolbar();
  try {
    S.data = MODE === "static" ? await lockScreen() : await (await fetch("api/data", { cache: "no-store" })).json();
  } catch (e) {
    $("#main").innerHTML = `<p class="hint">Could not load data: ${esc(e.message)}</p>`;
    return;
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
}
init();
})();
